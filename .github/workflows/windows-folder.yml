# The folder of Tensela for Windows (stage 4 of the plan for Windows): built from the lock, opened as a person would
# (Tensela.exe and tensela-cli.exe, from another folder), and kept as an artifact to try it. By hand.

name: Folder for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  folder:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build it (every download checked against the lock)
        shell: bash
        run: python tools/build_windows.py

      - name: The portable Python, also by the provenance of its release (Sigstore)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify build/windows/downloads/cpython-*-windows-msvc-install_only.tar.gz
               --repo astral-sh/python-build-standalone

      - name: The terminal with and without its launcher (diagnosis)
        shell: bash
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          folder=$(ls -d "$PWD"/build/windows/Tensela-*-windows-x64)
          tower="$PWD/src/tensela/templates/twisting-tower.tela"
          cd "$RUNNER_TEMP"
          try() {
            code=0; "$@" > out.txt 2>&1 || code=$?
            echo "== code $code: ${*: -6}"; grep -E "Written|OpenGL|fatal" out.txt | tail -3
          }
          try "$folder/python/python.exe" -c "import sys; from tensela.cli import run; sys.exit(run())" \
              "$tower" --obj a.obj --png a.png
          try "$folder/python/python.exe" -c "import sys; from tensela.ui import opengl_choice as O; \
              print('OpenGL', O.choose()); from tensela.cli import run; sys.exit(run())" \
              "$tower" --obj b.obj --png b.png
          TENSELA_OPENGL=software try "$folder/tensela-cli.exe" "$tower" --obj c.obj --png c.png
          try "$folder/tensela-cli.exe" "$tower" --obj d.obj
          try "$folder/tensela-cli.exe" "$tower" --obj e.obj --png e.png

      - name: Open it from another folder, as a person would
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: |
          folder=$(ls -d "$PWD"/build/windows/Tensela-*-windows-x64)
          templates="$PWD/src/tensela/templates"
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          "$folder/python/python.exe" -c "from tensela.ui import opengl_choice as O; print('OpenGL:', O.choose())"
          "$folder/tensela-cli.exe" "$templates/twisting-tower.tela" --obj tower.obj --png tower.png
          ls -l tower.obj tower.png
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          "$folder/Tensela.exe" "$templates/hypar-roof.tela" --seconds 5
          ls -l "$XDG_CONFIG_HOME/Tensela/Tensela.ini"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensela-windows-folder
          path: |
            build/windows/Tensela-*-windows-x64.zip
            ${{ runner.temp }}/try/tower.png
