name: Check the AppImage

# Opens a published AppImage on Ubuntu 22.04, the oldest system Tensela supports, the way the catalogue of AppImages
# tests it: a virtual screen of 800 × 600, no window manager while it waits for the window, no desktop and no
# network. It runs it twice, as it is and inside firejail (as the catalogue does), and keeps a capture of the screen,
# the windows, the output of Tensela and, while no window appears, where its Python is. Started by hand, on a
# release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check (v0.9.3); empty: the newest"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
    steps:
      - name: The tools of the test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb x11-utils xdotool imagemagick \
            libgl1-mesa-dri mesa-utils fuse3 libfuse2 firejail

      - name: The AppImage of the release, checked
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release && cd release
          if [ -z "$TAG" ]; then TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "Release: $TAG"
          # From this same repository; its fingerprint as SHA256SUMS says (minisign is not among the packages of 22.04)
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Tensela-*-x86_64.AppImage' -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          chmod +x Tensela-*.AppImage
          mv Tensela-*.AppImage ../Tensela.AppImage

      - name: A screen of 800 × 600, without a window manager while it waits for the window (as the catalogue)
        run: |
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          sleep 2
          glxinfo -B 2>/dev/null | grep -E "renderer|version" || true
          python3 -m pip install --quiet --user py-spy==0.4.1   # where a running Python is, without stopping it
          echo "PYSPY=$HOME/.local/bin/py-spy" >> "$GITHUB_ENV"

      - name: Open it, as it is and inside firejail
        run: |
          mkdir -p out
          try() {   # try NAME COMMAND...: starts it and looks for 90 s, keeping what it sees on the way
            name=$1; shift
            home=$(mktemp -d)
            HOME=$home "$@" > "out/$name.log" 2>&1 &
            pid=$!
            for second in $(seq 1 90); do
              sleep 1
              kill -0 $pid 2>/dev/null || { echo "$name: it ended after $second s" | tee -a out/summary.txt; break; }
              if timeout 5 xdotool search --onlyvisible --name '.' >/dev/null 2>&1; then
                echo "$name: a window after $second s" | tee -a out/summary.txt
                sleep 3; import -window root "out/$name-shown.png" || true; break
              fi
              if [ $((second % 15)) = 0 ]; then   # every 15 s: the screen, the windows, where its Python is
                import -window root "out/$name-$second.png" || true
                xwininfo -root -tree > "out/$name-$second-windows.txt" 2>&1 || true
                python=$(pgrep -f "tensela.ui.launch" | head -n 1)
                [ -n "$python" ] && sudo "$PYSPY" dump --pid "$python" > "out/$name-$second-python.txt" 2>&1
                echo "$name: nothing visible after $second s" | tee -a out/summary.txt
              fi
            done
            pkill -f "tensela.ui.launch" 2>/dev/null || true
            kill $pid 2>/dev/null || true
            sleep 2
            pkill -9 -f "tensela.ui.launch" 2>/dev/null || true
            rm -rf "$home"
          }
          try plain ./Tensela.AppImage
          try firejail firejail --quiet --noprofile --net=none --appimage ./Tensela.AppImage
          echo; cat out/summary.txt
          for name in plain firejail; do
            echo; echo "==== $name: the last lines of its output"; tail -n 60 "out/$name.log"
            for f in out/$name-*-python.txt; do
              if [ -e "$f" ]; then echo "---- $f"; cat "$f"; fi
            done
          done

      - name: What it saw
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: check-appimage
          path: out/
