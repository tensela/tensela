# The tests of Tensela on Windows: what breaks there, before any Windows version (stage 1 of the plan for Windows).
# By hand, from the Actions tab or `gh workflow run windows-tests.yml`. The same library versions as the AppImage
# (without its hashes, which are of the Linux wheels). It never fails the run: the report is what counts.

name: Tests on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The libraries, the versions of the AppImage
        shell: bash
        run: |
          grep -v '^#' tools/appimage-requirements.txt | sed 's/ --hash=.*//' | grep -v '^$' > windows-requirements.txt
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --only-binary=:all: -r windows-requirements.txt pytest
          python -m pip install --quiet --no-deps -e .
          python -c "import vtk, PySide6, manifold3d; print('VTK', vtk.vtkVersion.GetVTKVersion(), 'Qt', PySide6.__version__)"

      - name: The tests, file by file (a crash of the 3D view does not hide the rest)
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p logs
          : > summary.txt
          for f in tests/test_*.py; do
            name=$(basename "$f" .py)
            code=0
            python -m pytest -q -rfE -p no:cacheprovider "$f" > "logs/$name.log" 2>&1 || code=$?
            last=$(grep -E "passed|failed|error|skipped|no tests ran" "logs/$name.log" | tail -1 || true)
            if grep -q "Windows fatal exception" "logs/$name.log"; then last="CRASHED (code $code) $last"; fi
            echo "$name: $last" >> summary.txt
          done
          cat summary.txt

      - name: What failed
        if: always()
        shell: bash
        run: |
          echo "Files with a crash: $(grep -c CRASHED summary.txt || true)"
          echo "Files with failures: $(grep -cE 'failed|error' summary.txt || true)"
          grep -hE "^(FAILED|ERROR) " logs/*.log | sed -E 's/ - (.{0,160}).*/ - \1/' | sort | uniq > failed.txt || true
          echo "Tests failed: $(wc -l < failed.txt)"
          cat failed.txt
          grep -h -A3 "Windows fatal exception" logs/*.log | grep -E "File .*tensela" | sort | uniq -c | head -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests
          path: |
            summary.txt
            failed.txt
            logs/
