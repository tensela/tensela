id = "animation"
name = "Animation"
version = "1.0.0"
author = "Tensela"
description = "Exports what a slider does as it moves, as a GIF or a series of PNG images: the tower turning, the facade opening. For presentations and social networks."
tensela = "0.9"
licence = "GPL-3.0-or-later"
website = "https://tensela.com/extensions/animation/"
issues = "https://github.com/tensela/tensela/issues"
source = "https://github.com/tensela/tensela/tree/main/src/tensela/bundled_extensions/animation"

[es]
name = "Animación"
description = "Exporta lo que hace un deslizador al moverse, como un GIF o una serie de imágenes PNG: la torre girando, la fachada abriéndose. Para presentaciones y redes."

[translations.es]
"Animate a slider…" = "Animar un deslizador…"
"What a slider does as it moves, as a GIF or PNG images" = "Lo que hace un deslizador al moverse, como GIF o imágenes PNG"
"Animate a slider" = "Animar un deslizador"
"Slider" = "Deslizador"
"From" = "Desde"
