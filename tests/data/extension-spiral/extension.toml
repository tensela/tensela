licence = "GPL-3.0-or-later"
website = "https://tensela.com/extensions/spiral/"
issues = "https://github.com/tensela/tensela/issues"
source = "https://github.com/tensela/tensela/tree/main/tests/data/extension-spiral"

[es]
name = "Espiral"
description = "Un ejemplo: un nodo que dibuja una espiral, una acción que saluda, una entrada en el clic derecho de un nodo y un panel que escucha lo que pasa."

