id = "ai-connection"
name = "AI connection"
version = "0.2.0"
author = "Tensela"
description = "Lets an AI program of your choice look at the open project and change it (each step undone with Ctrl+Z): through a local connection, inside your computer. Tensela itself still does not connect to anything."
tensela = "0.9"
licence = "GPL-3.0-or-later"
website = "https://tensela.com/extensions/ai-connection/"
issues = "https://github.com/tensela/tensela/issues"
source = "https://github.com/tensela/tensela/tree/main/extensions/ai-connection"

[permissions]
local = "So that the AI program you set up talks with the open window: through a file of your user (a local socket) that only you can open. Nothing goes to the internet and no port is opened."

[es]
name = "Conexión con IA"
description = "Deja que un programa de IA que tú elijas mire el proyecto abierto y lo cambie (cada paso se deshace con Ctrl+Z): por una conexión local, dentro de tu computadora. Tensela misma sigue sin conectarse a nada."

[es.permissions]
local = "Para que el programa de IA que configures hable con la ventana abierta: por un archivo de tu usuario (un socket local) que solo tú puedes abrir. Nada sale a internet y no se abre ningún puerto."

