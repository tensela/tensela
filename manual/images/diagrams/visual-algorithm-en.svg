<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 400" width="1300" height="400">
<rect width="1300" height="400" fill="#16151b"/>
<text x="40.0" y="40.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="16" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">As a recipe</text>
<text x="380.0" y="40.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="16" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">As code</text>
<text x="770.0" y="40.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="16" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">As nodes</text>
<text x="40.0" y="90.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">1. Take a rectangle of 20 × 12 m.</text>
<text x="40.0" y="116.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">2. Divide it into panels of 1 m.</text>
<text x="40.0" y="142.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">3. Find the centre of each</text>
<text x="40.0" y="168.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">    panel.</text>
<text x="40.0" y="194.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">4. Put a sun fin on each centre.</text>
<rect x="380.0" y="62.0" width="340.0" height="200.0" rx="8" fill="#1f1e26" stroke="#34323e" stroke-width="1.0" opacity="1.0"/>
<text x="396.0" y="92.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">facade = rectangle(20, 12)</text>
<text x="396.0" y="118.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">panels = grid(facade, 1, 1)</text>
<text x="396.0" y="144.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">centres = [centre(p)</text>
<text x="396.0" y="170.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">           for p in panels]</text>
<text x="396.0" y="196.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">fins = [place(box, c)</text>
<text x="396.0" y="222.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">        for c in centres]</text>
<rect x="770.0" y="140.0" width="104.0" height="30.0" rx="9" fill="#1d1c23" stroke="#6e93c6" stroke-width="1.2" opacity="1.0"/>
<path d="M779.0,140.0 h86.0 a9,9 0 0 1 9,9 v-5 h-104.0 v5 a9,9 0 0 1 9,-9 z" fill="#6e93c6" opacity="1.0"/>
<text x="782.0" y="162.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">Rectangle</text>
<circle cx="874.0" cy="158.0" r="5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<rect x="902.0" y="140.0" width="104.0" height="59.0" rx="9" fill="#1d1c23" stroke="#c9a15c" stroke-width="1.2" opacity="1.0"/>
<path d="M911.0,140.0 h86.0 a9,9 0 0 1 9,9 v-5 h-104.0 v5 a9,9 0 0 1 9,-9 z" fill="#c9a15c" opacity="1.0"/>
<text x="914.0" y="162.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">Grid</text>
<circle cx="1006.0" cy="158.0" r="5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<circle cx="902.0" cy="185.0" r="4.5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<text x="914.0" y="189.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre"></text>
<rect x="1034.0" y="140.0" width="104.0" height="59.0" rx="9" fill="#1d1c23" stroke="#c9a15c" stroke-width="1.2" opacity="1.0"/>
<path d="M1043.0,140.0 h86.0 a9,9 0 0 1 9,9 v-5 h-104.0 v5 a9,9 0 0 1 9,-9 z" fill="#c9a15c" opacity="1.0"/>
<text x="1046.0" y="162.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">Centre</text>
<circle cx="1138.0" cy="158.0" r="5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<circle cx="1034.0" cy="185.0" r="4.5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<text x="1046.0" y="189.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre"></text>
<rect x="1166.0" y="140.0" width="104.0" height="59.0" rx="9" fill="#1d1c23" stroke="#d08a7c" stroke-width="1.2" opacity="1.0"/>
<path d="M1175.0,140.0 h86.0 a9,9 0 0 1 9,9 v-5 h-104.0 v5 a9,9 0 0 1 9,-9 z" fill="#d08a7c" opacity="1.0"/>
<text x="1178.0" y="162.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="650" fill="#ecebf3" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">Place</text>
<circle cx="1270.0" cy="158.0" r="5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<circle cx="1166.0" cy="185.0" r="4.5" fill="#6b6976" stroke="#1d1c23" stroke-width="2" opacity="1.0"/>
<text x="1178.0" y="189.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="11.5" font-weight="400" fill="#c4c2cf" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre"></text>
<path d="M874.0,158.0 C914.0,158.0 862.0,185.0 902.0,185.0" stroke="#6e93c6" stroke-width="2.0" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1006.0,158.0 C1046.0,158.0 994.0,185.0 1034.0,185.0" stroke="#c9a15c" stroke-width="2.0" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1138.0,158.0 C1178.0,158.0 1126.0,185.0 1166.0,185.0" stroke="#c9a15c" stroke-width="2.0" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40.0" y="330.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#9a98a8" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">The same algorithm three times. Anyone understands the recipe, a machine runs the code,</text>
<text x="40.0" y="352.0" font-family="Inter, 'Inter Variable', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#9a98a8" text-anchor="start" opacity="1.0" xml:space="preserve" style="white-space:pre">and the nodes are both: they read like a recipe and run like a program.</text>
</svg>
